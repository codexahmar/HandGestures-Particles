<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Aetheris - Interactive 3D Particle System with Hand Tracking">
    <title>Aetheris — Interactive 3D Particles</title>

    <!-- Professional Typography: Inter & Inter Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">

    <!-- Three.js Import Map -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>

    <!-- MediaPipe Vision Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
</head>

<body>
    <!-- 3D Canvas -->
    <div id="canvas-container"></div>

    <!-- UI Overlay Layer -->
    <div id="ui-layer">
        <!-- Top Navigation Bar -->
        <header class="navbar">
            <div class="nav-brand">
                <div class="brand-mark"></div>
                <div class="brand-text">
                    <span class="brand-name">Aetheris</span>
                    <span class="brand-badge">Engine</span>
                </div>
            </div>

            <!-- System Metrics Status Pill -->
            <div class="status-pill">
                <span class="metric" id="particle-count">8k</span>
                <span class="separator">/</span>
                <span class="metric" id="fps-counter">60 FPS</span>
            </div>

            <!-- Top Actions -->
            <div class="nav-actions">
                <button class="nav-btn" id="record-btn" title="Record Screen (R)">Record Clip</button>
            </div>
        </header>

        <!-- Main Configuration Panel -->
        <aside class="control-panel">
            <div class="panel-header">
                <span class="panel-title">Parameters</span>
                <button class="icon-btn" id="collapse-btn" aria-label="Collapse panel">
                    <svg width="14" height="14" viewBox="0 0 16 16" fill="none">
                        <path d="M4 6L8 10L12 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
                    </svg>
                </button>
            </div>

            <div class="panel-content">
                <!-- Geometry Selector -->
                <div class="control-field">
                    <label for="template-select">Geometry</label>
                    <div class="select-wrapper">
                        <select id="template-select" class="form-select">
                            <option value="galaxy">Galaxy Spiral</option>
                            <option value="blackhole">Black Hole</option>
                            <option value="saturn">Saturn System</option>
                            <option value="dna">DNA Helix</option>
                            <option value="heart">Heart Nebula</option>
                            <option value="flower">Quantum Lotus</option>
                            <option value="wave">Wave Field</option>
                            <option value="sphere">Celestial Sphere</option>
                        </select>
                    </div>
                </div>

                <!-- Sliders -->
                <div class="control-field">
                    <div class="field-label-row">
                        <label for="glow-slider">Luminance</label>
                        <span class="field-value" id="glow-value">1.8</span>
                    </div>
                    <input type="range" id="glow-slider" class="form-range" min="0.5" max="3.5" step="0.1" value="1.8">
                </div>

                <div class="control-field">
                    <div class="field-label-row">
                        <label for="size-slider">Particle Size</label>
                        <span class="field-value" id="size-value">1.4</span>
                    </div>
                    <input type="range" id="size-slider" class="form-range" min="0.4" max="4.0" step="0.1" value="1.4">
                </div>

                <div class="control-field">
                    <div class="field-label-row">
                        <label for="speed-slider">Speed</label>
                        <span class="field-value" id="speed-value">1.0</span>
                    </div>
                    <input type="range" id="speed-slider" class="form-range" min="0.2" max="2.5" step="0.1" value="1.0">
                </div>

                <!-- Color Controls -->
                <div class="control-field">
                    <label>Colors</label>
                    <div class="color-row">
                        <div class="color-input-wrap">
                            <input type="color" id="color-primary" value="#38bdf8" title="Primary Color">
                            <span>Primary</span>
                        </div>
                        <div class="color-input-wrap">
                            <input type="color" id="color-secondary" value="#818cf8" title="Secondary Color">
                            <span>Secondary</span>
                        </div>
                    </div>
                </div>

                <!-- Toggles -->
                <div class="control-field">
                    <label class="switch-label">
                        <input type="checkbox" id="rotate-toggle" checked>
                        <span class="switch-ui"></span>
                        <span class="switch-text">Auto Rotation</span>
                    </label>
                </div>

                <!-- Action Buttons -->
                <div class="action-grid">
                    <button class="btn btn-primary" id="shockwave-btn">Shockwave (Space)</button>
                    <button class="btn btn-secondary" id="audio-toggle-btn">Audio React (M)</button>
                    <button class="btn btn-ghost" id="reset-btn">Reset</button>
                </div>

                <!-- Shortcuts Legend -->
                <div class="shortcuts-legend">
                    <div class="legend-row"><kbd>SPACE</kbd> Shockwave</div>
                    <div class="legend-row"><kbd>1-8</kbd> Switch Shape</div>
                    <div class="legend-row"><kbd>R</kbd> Record Video</div>
                    <div class="legend-row"><kbd>M</kbd> Audio React</div>
                </div>
            </div>
        </aside>

        <!-- Vision Gesture HUD Card -->
        <div class="gesture-card">
            <div class="gesture-card-header">
                <span class="status-bullet" id="status-dot"></span>
                <span class="gesture-title">Motion Sensor</span>
            </div>
            <p class="gesture-caption" id="gesture-text">Standby: Show hand or click to interact</p>
            <div class="gesture-hints">
                <span>• Open Palm: Expand</span>
                <span>• Fist: Contract</span>
                <span>• Pinch: Color Shift</span>
                <span>• Swipe: Switch Form</span>
            </div>
        </div>

        <!-- Camera PIP Overlay -->
        <div class="camera-card">
            <video id="video-preview" autoplay playsinline muted></video>
            <canvas id="hand-canvas"></canvas>
            <button class="cam-toggle-btn" id="video-toggle" title="Toggle Camera (C)">
                <svg width="14" height="14" viewBox="0 0 20 20" fill="currentColor">
                    <path d="M2 5C2 3.89543 2.89543 3 4 3H12C13.1046 3 14 3.89543 14 5V15C14 16.1046 13.1046 17 12 17H4C2.89543 17 2 16.1046 2 15V5Z" />
                    <path d="M14 7L18 4V16L14 13V7Z" />
                </svg>
            </button>
        </div>

        <!-- Minimal Loading Screen -->
        <div class="loading-screen" id="loading-screen">
            <div class="loading-box">
                <div class="loader-spinner"></div>
                <div class="loader-text">Loading Aetheris...</div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        setTimeout(() => {
            const loading = document.getElementById('loading-screen');
            if (loading && !loading.classList.contains('hidden')) {
                loading.classList.add('hidden');
            }
        }, 2000);
    </script>
    <script type="module" src="config.js"></script>
    <script type="module" src="shaders.js"></script>
    <script type="module" src="templates.js"></script>
    <script type="module" src="handTracking.js"></script>
    <script type="module" src="main.js"></script>
</body>

</html>
